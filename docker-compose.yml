# Smart Global ERP — Docker Compose for Production
# Includes: ERP app, PostgreSQL, Redis, Nginx reverse proxy

version: "3.8"

services:
  # ============ ERP Application ============
  erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://erp_user:${DB_PASSWORD}@postgres:5432/smart_erp?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://erp.smartwebstudio.com
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - erp_uploads:/app/uploads
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:16-alpine
    container_name: smart-erp-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smart_erp
      - POSTGRES_USER=erp_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d smart_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: smart-erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Nginx Reverse Proxy (Load Balancer + SSL) ============
  nginx:
    image: nginx:alpine
    container_name: smart-erp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - erp
    networks:
      - erp-network

  # ============ Realtime WebSocket Service ============
  realtime:
    build:
      context: ./mini-services/realtime
      dockerfile: Dockerfile
    container_name: smart-erp-realtime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - erp-network

volumes:
  postgres_data:
  redis_data:
  erp_uploads:

networks:
  erp-network:
    driver: bridge
